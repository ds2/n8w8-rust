[package]
name = "nachtwacht-models"
version = "0.3.0-alpha.1"
edition = "2021"
build = "build.rs"
license = "GPLv3"
description = "This package contains all the models and APIs to deal with n8w8."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.83"
protobuf = "3.7.1"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.132"
thiserror = "2.0.0"

[build-dependencies]
protobuf-codegen = "3.7.1"
protoc-bin-vendored = "3.1.0"
