[package]
name = "nachtwacht-frontend"
version = "0.3.0-alpha.1"
edition = "2021"
license = "AGPLv3"
description = "This is the frontend webapp server to configure and inspect N8w8."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.9.0"
actix-files = "0.6.6"
actix-session = {version="0.10.1", features=["cookie-session"]}
async-stream = "0.3.5"
prost = "0.14.0"
protobuf = "3.3.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"
